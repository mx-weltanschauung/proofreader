# Кто получает готовый HTML вместо SPA.
#
# Краулеры мессенджеров (Telegram, WhatsApp, ВК, Slack, Discord) JS не
# исполняют вообще и никогда не будут: без этой ветки любая ссылка на
# читальню разворачивается в пустую плашку со словом «Читальня». Поисковые
# роботы JS исполняют, но Яндекс — плохо, а Гугл — с задержкой.
#
# Смотреть сюда будут из-за «почему у ВК не появилось превью», поэтому список
# живёт рядом с остальной маршрутизацией, а не в коде Go.
map $http_user_agent $is_crawler {
    default 0;
    "~*(Googlebot|Google-InspectionTool|YandexBot|YandexRenderResourcesBot|bingbot|DuckDuckBot|Applebot|TelegramBot|WhatsApp|vkShare|Twitterbot|facebookexternalhit|Slackbot|Discordbot|LinkedInBot|SkypeUriPreview|redditbot|Mastodon|ChatGPT-User|Claude-User|Perplexity-User)" 1;
}

# ChatGPT-User, Claude-User, Perplexity-User — сборщики чатов, открывающие
# страницу по просьбе читателя (он дал ссылку в чате). JS они не исполняют,
# без этой строки получали пустую SPA. Обучающих роботов (GPTBot, ClaudeBot,
# CCBot…) здесь нет и быть не должно — им robots.txt отвечает Disallow: /.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Перед фронтом на боевом стоит Caddy, и $remote_addr здесь — его
    # адрес. real_ip_recursive идёт по X-Forwarded-For справа налево,
    # пропуская доверенные адреса, и останавливается на первом чужом —
    # то есть на настоящем читателе. Подделанный браузером хвост XFF
    # рекурсию не сбивает: Caddy дописывает настоящий адрес справа.
    # Уровень server, а не location: модуль realip отрабатывает в фазе
    # POST_READ, до выбора location, и конфиг этого модуля подхватывается
    # только со второго прохода — тем же уровнем, на котором заявлен listen.
    # Заяви его глубже, в location, и он продолжит применяться лишь пока
    # никто не заведёт такой же блок на server: тогда он перестанет
    # действовать молча, без единой строки в логе.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    # Узлы Cloudflare (https://www.cloudflare.com/ips-v4, снято 28.08.2026).
    # Без них за проксированием рекурсия останавливается на адресе узла
    # Cloudflare и считает читателем его: все читатели за одним узлом
    # сливаются в одного, а предел «5 писем в час на адрес» из
    # internal/api/feedback становится общим на весь этот узел — первые пять
    # писем закрывают приём остальным. Список меняется у Cloudflare редко, но
    # меняется: расхождение проявится не отказом, а именно этим слипанием,
    # молча. Пополнять по первоисточнику, ссылка выше.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Сборка фронта — это сотни килобайт JS и CSS, они жмутся в разы.
    # Ответы бэкенда приходят сюда уже сжатыми им самим, и nginx их не
    # трогает, увидев Content-Encoding.
    gzip on;
    gzip_vary on;
    # Ниже этой длины заголовок gzip съедает выигрыш, а ответ всё равно
    # уместился бы в один пакет.
    gzip_min_length 1400;
    gzip_comp_level 5;
    gzip_proxied any;
    # text/html жмётся всегда и в списке не нужен.
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml;

    location /api/ {
        # Через этот прокси едет оригинал тома: PDF и DJVU корпуса — от 8 до
        # 195 МБ. Дефолт nginx — 1 МБ, то есть загрузка отвергалась бы с 413.
        client_max_body_size 512m;
        # create-pages рисует превью синхронно, сотнями страниц за батч, и в
        # дефолтные 60 с не укладывается: клиент получал бы 504, пока сервер
        # продолжает работу.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Имя каждого файла в /assets/ содержит хэш содержимого: изменилось
    # содержимое — изменилось имя. Значит, отданный файл не устареет никогда, и
    # переспрашивать про него не о чем. Без этого браузер на каждый заход
    # ходил за 304 по всем кускам — по круговой задержке на файл, а кусков
    # после разрезания бандла стало больше трёх десятков.
    #
    # index.html под это правило НЕ попадает (он в location / ниже) и хэша в
    # имени не имеет: именно он приносит новые имена кусков после выкатки, и
    # закэшируй его — читальня осталась бы на старой сборке.
    # Только add_header, без expires: expires выставляет свой Cache-Control, и
    # вместе они дали бы два заголовка с одним именем.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Расширения .webmanifest в mime.types nginx нет, и файл уезжает как
    # application/octet-stream. Пустой блок types гасит унаследованную
    # таблицу, default_type подставляет верный тип — иначе пришлось бы
    # повторять include mime.types целиком. Точное совпадение бьёт
    # префиксный location / ниже, поэтому ветка краулера сюда не лезет:
    # манифест одинаков для всех.
    location = /site.webmanifest {
        types {}
        default_type application/manifest+json;
        try_files /instance$uri $uri =404;
    }

    # Каталог экземпляра (instance/ репозитория, смонтирован в
    # /usr/share/nginx/html/instance): иконки, manifest, ключи поисковиков —
    # всё, чем эта читальня отличается от любой другой. Файл экземпляра
    # берётся раньше файла сборки (try_files /instance$uri в location / и
    # у manifest выше); каталога нет — отдаётся сборка.
    #
    # Правовая страница — точным правилом и без отката в SPA: файла нет —
    # 404, а не оболочка index.html с кодом 200, иначе фронт принял бы её за
    # текст. X-Instance-File — отметка «это файл экземпляра», по ней фронт
    # отличает его от оболочки, которую на тот же адрес отдаёт dev-сервер.
    location = /legal.html {
        root /usr/share/nginx/html/instance;
        add_header X-Instance-File 1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Карта сайта, robots и карточки превью — одинаковы для всех, разбора
    # User-Agent тут не нужно.
    location = /robots.txt {
        proxy_pass http://backend:8080/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Текст для нейросетей (internal/seo/render_llm.go): отдаётся всем, а не
    # только роботам, — человек, открывший .md, видит ровно то, что видит
    # модель. Ошибки не перехватываются: 404/410 текстом, а не SPA.
    location = /llms.txt {
        proxy_pass http://backend:8080/seo/llms.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Каталог OPDS (internal/opds) для читалок и агрегаторов. Всем, без
    # проверки агента и без перехвата ошибок в SPA: читалке нужен 404 текстом,
    # а не оболочка SPA с кодом 200. Префикс, а не равенство: ленты лежат
    # под /opds/…; лишнее вроде /opdsx бэкенд отвечает 404 сам.
    location /opds {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP-сервер читальни (internal/mcp): вопросы нейросети по всей читальне.
    # Всем, без проверки агента и без перехвата ошибок в SPA. Тело — JSON-RPC,
    # 64 КБ с запасом; ожидание ворот поиска и рендер главы — до минуты.
    location = /mcp {
        client_max_body_size 64k;
        proxy_read_timeout 120s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/works/.+\.md$ {
        # Переписывание, а не proxy_pass http://…/seo$uri: proxy_pass с
        # переменной отдаёт $uri декодированным, без повторного экранирования.
        # После rewrite…break proxy_pass без пути передаёт переписанный адрес,
        # заново экранированный, — тот же приём, что у location /seo/ ниже.
        rewrite ^ /seo$uri break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Понятия указателя для нейросетей (internal/seo/render_concept_llm.go):
    # тем же приёмом, что .md глав, — всем, без перехвата ошибок в SPA.
    # Своего location у страниц понятий нет — они идут через location / ниже,
    # а точное и регулярное правила его перебивают.
    location = /concepts.md {
        rewrite ^ /seo$uri break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/concepts/.+\.md$ {
        rewrite ^ /seo$uri break;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8080/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/sitemap-[a-z]+(-\d+)?\.xml$ {
        proxy_pass http://backend:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /og/ {
        proxy_pass http://backend:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Внутренний адрес: снаружи в /seo/ никто не ходит, сюда попадают только
    # переброшенные запросы краулеров из location / ниже.
    location /seo/ {
        internal;
        # Один адрес отдаёт два разных ответа в зависимости от User-Agent —
        # значит, всякий общий кэш обязан знать об этом, иначе он вправе
        # отдать страницу-список живому читателю вместо приложения. Без этого
        # заголовка страница краулера ехала с «Cache-Control: public,
        # max-age=600», то есть прямо приглашала так сделать. Пока перед
        # читальней нет CDN, это спит; за Cloudflare просыпается.
        add_header Vary "User-Agent" always;
        # Без пути в proxy_pass: nginx передаст переписанный $uri
        # (/seo/works/1). С $request_uri уехал бы исходный путь (/works/1),
        # которого у бэкенда нет, и краулер получал бы 404 на каждой странице.
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Рендер главы на 300 полос не укладывается в дефолтные 60 секунд.
        proxy_read_timeout 120s;

        # internal/seo/handler.go знает только девять форм адреса (match())
        # и честно отвечает 404 на всё остальное — /help, /vite.svg,
        # несуществующую сущность. Без перехвата это был бы конец истории для
        # краулера: обычный читатель тем временем получил бы try_files ниже.
        # Перехватываем такой 404 и досылаем в @spa тем же путём, каким его
        # получил бы читатель без ветки is_crawler — статику как файл,
        # остальное как оболочку SPA.
        proxy_intercept_errors on;
        error_page 404 = @spa;
    }

    # Именованный location достижим только через error_page выше. $uri здесь
    # уже переписан рестартом ^ /seo$uri (см. location / ниже) и указывает на
    # /seo/help, а не на исходный /help — original_uri несёт путь, каким его
    # видел браузер, до переписывания.
    #
    # Финальный параметр try_files, начинающийся с «/», — это не «отдай файл,
    # если он есть», а полноценный внутренний редирект с новым проходом по
    # location: подставь сюда литерал /index.html, и запрос вернётся в
    # location / с тем же is_crawler, получит второй rewrite на
    # /seo/index.html — а error_page у nginx срабатывает один раз за запрос,
    # так что второй 404 от бэкенда дойдёт до читателя как есть, без обёртки
    # в SPA. Поэтому конечный откат — на именованный location, а не на строку
    # пути: именованные location получают текущий root напрямую, без
    # повторного прохода по map/if.
    location @spa {
        internal;
        try_files $original_uri $original_uri/ @spa_shell;
    }

    location @spa_shell {
        internal;
        try_files /index.html =404;
    }

    location / {
        # Вторая половина той же пары: ветку краулера метит location /seo/,
        # ветку читателя — эта строка. Кэш должен различать их с обеих
        # сторон, иначе оболочка SPA, положенная в кэш от читателя, уедет
        # краулеру — и превью снова не будет.
        add_header Vary "User-Agent" always;

        # Краулер получает готовый HTML, читатель — SPA. Разница ровно в
        # этой строке; всё остальное для человека не меняется ни на байт.
        if ($is_crawler) {
            # rewrite меняет $uri на /seo$uri — original_uri снят до этого,
            # иначе @spa унаследовал бы уже переписанный путь и упорно бы
            # искал файл /seo/vite.svg вместо /vite.svg.
            set $original_uri $uri;
            rewrite ^ /seo$uri last;
        }
        try_files /instance$uri $uri $uri/ /index.html;
    }
}
