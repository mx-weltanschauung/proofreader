name: images

# Образы каждого тега — в ghcr.io: своя читальня может не собирать их сама
# (IMAGE_PREFIX/IMAGE_TAG в docker-compose.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: backend
            context: .
            file: docker/backend/Dockerfile
          - name: migrate
            context: .
            file: docker/backend/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
