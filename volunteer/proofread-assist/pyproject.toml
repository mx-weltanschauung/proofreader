[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proofread-assist"
dynamic = ["version"]
description = "Volunteer chapter proofreading helper"
requires-python = ">=3.10"

[project.scripts]
proofread-assist = "proofread_assist.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["proofread_assist"]

[tool.setuptools.dynamic]
version = {attr = "proofread_assist.__version__"}
