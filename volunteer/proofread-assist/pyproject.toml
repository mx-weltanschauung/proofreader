[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proofread-assist"
version = "0.1.0"
description = "Volunteer chapter proofreading helper"
requires-python = ">=3.10"

[project.scripts]
proofread-assist = "proofread_assist.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
